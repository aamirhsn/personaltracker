<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vault" />
  <meta name="theme-color" content="#f1f5f9" />
  <title>Vault - Premium Finance</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --danger-bg: #fee2e2;
      --success: #10b981;
      --success-bg: #d1fae5;
      --border: #e2e8f0;
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 32px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    header {
      padding: calc(24px + env(safe-area-inset-top)) 24px 16px;
      background: var(--bg);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text-main);
    }

    /* Main Content */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 0 24px 120px;
      -webkit-overflow-scrolling: touch;
    }

    .view-section { display: none; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .view-section.active { display: block; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Premium Dashboard Card & Graph */
    .dashboard-card {
      background: var(--primary);
      border-radius: var(--radius-md);
      padding: 24px;
      color: white;
      box-shadow: 0 12px 24px -8px rgba(79, 70, 229, 0.5);
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .dash-label { font-size: 13px; font-weight: 500; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.5px; }
    .dash-value { font-size: 40px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; }

    /* CSS Bar Chart */
    .chart-container {
      height: 100px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      margin-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 16px;
    }
    .chart-bar-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      height: 100%;
    }
    .chart-bar {
      width: 100%;
      max-width: 30px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 6px;
      transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .chart-label { font-size: 10px; font-weight: 600; opacity: 0.9; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

    /* Modern List Items */
    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text-main); }
    .card-list { display: flex; flex-direction: column; gap: 12px; }
    .item-card {
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s;
    }
    .item-card:active { transform: scale(0.98); }
    
    .item-info { display: flex; flex-direction: column; gap: 4px; }
    .item-title { font-size: 16px; font-weight: 600; color: var(--text-main); }
    .item-subtitle { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    
    .item-meta { display: flex; align-items: center; gap: 16px; }
    .item-amount { font-size: 17px; font-weight: 700; color: var(--text-main); }

    .badge {
      display: inline-flex; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px;
    }
    .badge-danger { background: var(--danger-bg); color: var(--danger); }
    .badge-success { background: var(--success-bg); color: var(--success); }

    .delete-btn {
      background: var(--bg); border: none; color: var(--text-muted); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    /* Floating Action Button */
    .fab {
      position: fixed;
      bottom: calc(90px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-main);
      color: white;
      border: none;
      border-radius: 100px;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 15px;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      z-index: 10;
      transition: transform 0.2s, background 0.2s;
    }
