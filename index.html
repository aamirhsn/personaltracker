<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vault" />
  <meta name="theme-color" content="#f1f5f9" />
  <title>Vault - Premium Finance</title>

  <!-- Inter Font & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --danger-bg: #fee2e2;
      --success: #10b981;
      --success-bg: #d1fae5;
      --radius-sm: 12px;
      --radius-md: 20px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: calc(24px + env(safe-area-inset-top)) 24px 16px;
      background: var(--bg);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    header h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; }

    main {
      flex: 1; overflow-y: auto; padding: 0 24px 120px; -webkit-overflow-scrolling: touch;
    }

    .view-section { display: none; animation: slideUp 0.4s ease-out forwards; }
    .view-section.active { display: block; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dashboard-card {
      background: var(--primary); border-radius: var(--radius-md); padding: 24px; color: white;
      box-shadow: 0 12px 24px -8px rgba(79, 70, 229, 0.5); margin-bottom: 24px; display: flex; flex-direction: column; gap: 16px;
    }
    .dash-label { font-size: 13px; font-weight: 500; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.5px; }
    .dash-value { font-size: 40px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; }

    .chart-container {
      height: 100px; display: flex; align-items: flex-end; gap: 8px; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 16px;
    }
    .chart-bar-group { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; height: 100%; }
    .chart-bar { width: 100%; max-width: 30px; background: rgba(255, 255, 255, 0.8); border-radius: 6px; transition: height 0.5s; }
    .chart-label { font-size: 10px; font-weight: 600; opacity: 0.9; text-align: center; }

    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .card-list { display: flex; flex-direction: column; gap: 12px; }
    .item-card {
      background: var(--surface); border-radius: var(--radius-sm); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm);
    }
    .item-info { display: flex; flex-direction: column; gap: 4px; }
    .item-title { font-size: 16px; font-weight: 600; }
    .item-subtitle { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .item-meta { display: flex; align-items: center; gap: 16px; }
    .item-amount { font-size: 17px; font-weight: 700; }

    .badge { display: inline-flex; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-top: 4px; }
    .badge-danger { background: var(--danger-bg); color: var(--danger); }
    .badge-success { background: var(--success-bg); color: var(--success); }

    .delete-btn { background: var(--bg); border: none; color: var(--text-muted); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    .fab {
      position: fixed; bottom: calc(90px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
      background: var(--text-main); color: white; border: none; border-radius: 100px; padding: 16px 28px;
      display: flex; align-items: center; gap: 8px; font-family: inherit; font-weight: 600; font-size: 15px; box-shadow: var(--shadow-lg); z-index: 10;
    }

    nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: calc(72px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      display: flex; justify-content: space-around; align-items: center; z-index: 20; border-top: 1px solid rgba(0,0,0,0.05);
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); width: 33.33%; font-size: 11px; font-weight: 600; background: none; border: none; gap: 4px; }
    .nav-item.active { color: var(--primary); }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      display: flex; justify-content: center; align-items: center; z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 24px;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--surface); width: 100%; max-width: 400px; border-radius: var(--radius-md); padding: 28px; box-shadow: var(--shadow-lg); }
    .modal-content h2 { font-size: 22px; font-weight: 700; margin-bottom: 24px; }

    .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .field input, .field select { background: var(--bg); border: 1px solid transparent; border-radius: var(--radius-sm); padding: 14px 16px; font-size: 16px; color: var(--text-main); font-family: inherit; font-weight: 500; }
    
    .modal-actions { display: flex; gap: 12px; margin-top: 28px; }
    .btn { flex: 1; padding: 14px; border-radius: var(--radius-sm); font-family: inherit; font-weight: 600; font-size: 15px; cursor: pointer; border: none; }
    .btn-cancel { background: var(--bg); color: var(--text-main); }
    .btn-save { background: var(--primary); color: white; }
    
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 15px; font-weight: 500; }
  </style>

  <script>
    // Failsafe error catcher - Will display on screen if it crashes
    window.onerror = function(msg, url, line) {
      document.body.innerHTML = `<div style="padding:40px; color:#ef4444; padding-top:80px; font-family:sans-serif;"><b>App Crashed!</b><br><br>Error: ${msg}<br>Line: ${line}</div>`;
    };
  </script>
</head>
<body>

  <header>
    <h1 id="appTitle">Overview</h1>
  </header>

  <main>
    <section id="view-expenses" class="view-section active">
      <div class="dashboard-card">
        <div>
          <div class="dash-label">Total Spent</div>
          <div class="dash-value" id="totalExpenseDisplay">$0.00</div>
        </div>
        <div class="chart-container" id="expenseChart"></div>
      </div>
      <div class="section-title">Recent Transactions</div>
      <div class="card-list" id="expenseList"></div>
    </section>

    <section id="view-cards" class="view-section">
      <div class="dashboard-card" style="background: #0f172a;">
        <div>
          <div class="dash-label">Pending Dues</div>
          <div class="dash-value" id="totalDueDisplay">$0.00</div>
        </div>
      </div>
      <div class="section-title">Active Statements</div>
      <div class="card-list" id="cardList"></div>
    </section>

    <section id="view-giftcards" class="view-section">
      <div class="dashboard-card" style="background: #0ea5e9;">
        <div>
          <div class="dash-label">Vault Balance</div>
          <div class="dash-value" id="totalGiftDisplay">$0.00</div>
        </div>
      </div>
      <div class="section-title">Stored Cards</div>
      <div class="card-list" id="giftList"></div>
    </section>
  </main>

  <button class="fab" id="fabAdd">
    <span class="material-symbols-rounded">add</span>
    <span id="fabText">New Expense</span>
  </button>

  <nav>
    <button class="nav-item active" onclick="switchTab('expenses')">
      <span class="material-symbols-rounded">donut_small</span>
      <span>Spend</span>
    </button>
    <button class="nav-item" onclick="switchTab('cards')">
      <span class="material-symbols-rounded">credit_card</span>
      <span>Cards</span>
    </button>
    <button class="nav-item" onclick="switchTab('giftcards')">
      <span class="material-symbols-rounded">redeem</span>
      <span>Gifts</span>
    </button>
  </nav>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <h2 id="modalTitle">Add Item</h2>
      <form id="entryForm">
        <div id="dynamicFormFields"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-save">Save Entry</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentTab = 'expenses';
    
    // Bulletproof data loading
    function safeLoad(key) {
      try {
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    const store = {
      expenses: safeLoad('vault_exp_v3'),
      cards: safeLoad('vault_cards_v3'),
      giftcards: safeLoad('vault_gift_v3')
    };

    function saveStore() {
      localStorage.setItem('vault_exp_v3', JSON.stringify(store.expenses));
      localStorage.setItem('vault_cards_v3', JSON.stringify(store.cards));
      localStorage.setItem('vault_gift_v3', JSON.stringify(store.giftcards));
      render();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      
      const tabIndex = tab === 'expenses' ? 0 : tab === 'cards' ? 1 : 2;
      document.querySelectorAll('.nav-item')[tabIndex].classList.add('active');

      if(tab === 'expenses') {
        document.getElementById('view-expenses').classList.add('active');
        document.getElementById('appTitle').textContent = 'Overview';
        document.getElementById('fabText').textContent = 'New Expense';
      } else if(tab === 'cards') {
        document.getElementById('view-cards').classList.add('active');
        document.getElementById('appTitle').textContent = 'Credit Dues';
        document.getElementById('fabText').textContent = 'Log Statement';
      } else {
        document.getElementById('view-giftcards').classList.add('active');
        document.getElementById('appTitle').textContent = 'Gift Vault';
        document.getElementById('fabText').textContent = 'Store Card';
      }
    }

    const fabBtn = document.getElementById('fabAdd');
    const modal = document.getElementById('modalOverlay');
    const formFields = document.getElementById('dynamicFormFields');
    const entryForm = document.getElementById('entryForm');

    fabBtn.addEventListener('click', () => {
      const today = new Date().toISOString().split('T')[0];
      if (currentTab === 'expenses') {
        document.getElementById('modalTitle').textContent = 'New Expense';
        formFields.innerHTML = `
          <div class="field"><label>Amount ($)</label><input type="number" step="0.01" id="expAmount" required /></div>
          <div class="field"><label>Description</label><input type="text" id="expDesc" required /></div>
          <div class="field"><label>Category</label><select id="expCategory"><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Other</option></select></div>
          <div class="field"><label>Date</label><input type="date" id="expDate" value="${today}" required /></div>
        `;
      } else if (currentTab === 'cards') {
        document.getElementById('modalTitle').textContent = 'Log Statement';
        formFields.innerHTML = `
          <div class="field"><label>Outstanding Balance ($)</label><input type="number" step="0.01" id="cardAmount" required /></div>
          <div class="field"><label>Card Name</label><input type="text" id="cardName" required /></div>
          <div class="field"><label>Due Date</label><input type="date" id="cardDueDate" required /></div>
        `;
      } else {
        document.getElementById('modalTitle').textContent = 'Store Gift Card';
        formFields.innerHTML = `
          <div class="field"><label>Balance ($)</label><input type="number" step="0.01" id="giftBalance" required /></div>
          <div class="field"><label>Store Name</label><input type="text" id="giftStore" required /></div>
          <div class="field"><label>Expiry Date</label><input type="date" id="giftExpiry" required /></div>
          <div class="field"><label>PIN / Notes</label><input type="text" id="giftCode" /></div>
        `;
      }
      modal.classList.add('active');
    });

    function closeModal() {
      modal.classList.remove('active');
      setTimeout(() => entryForm.reset(), 300);
    }

    entryForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = Date.now().toString();

      if (currentTab === 'expenses') {
        store.expenses.push({ id, desc: document.getElementById('expDesc').value, amount: Number(document.getElementById('expAmount').value), category: document.getElementById('expCategory').value, date: document.getElementById('expDate').value });
      } else if (currentTab === 'cards') {
        store.cards.push({ id, name: document.getElementById('cardName').value, amount: Number(document.getElementById('cardAmount').value), dueDate: document.getElementById('cardDueDate').value });
      } else {
        store.giftcards.push({ id, store: document.getElementById('giftStore').value, balance: Number(document.getElementById('giftBalance').value), expiry: document.getElementById('giftExpiry').value, code: document.getElementById('giftCode').value || '' });
      }

      saveStore();
      closeModal();
    });

    function deleteItem(type, id) {
      store[type] = store[type].filter(item => item.id !== id);
      saveStore();
    }

    function getDaysDiff(targetDateStr) {
      const today = new Date(); today.setHours(0,0,0,0);
      const target = new Date(targetDateStr);
      return Math.ceil((target - today) / (1000 * 60 * 60 * 24));
    }

    function renderChart() {
      const chartContainer = document.getElementById('expenseChart');
      if (store.expenses.length === 0) {
        chartContainer.innerHTML = '';
        return;
      }
      const categories = {};
      store.expenses.forEach(exp => { categories[exp.category] = (categories[exp.category] || 0) + (Number(exp.amount) || 0); });
      const maxVal = Math.max(...Object.values(categories), 1);
      
      chartContainer.innerHTML = Object.keys(categories).map(cat => {
        const heightPct = (categories[cat] / maxVal) * 100;
        return `<div class="chart-bar-group"><div class="chart-bar" style="height: ${heightPct}%;"></div><div class="chart-label">${cat.substring(0,4)}</div></div>`;
      }).join('');
    }

    function render() {
      const totalExp = store.expenses.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      document.getElementById('totalExpenseDisplay').textContent = `$${totalExp.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
      renderChart();

      const expList = document.getElementById('expenseList');
      if (store.expenses.length === 0) { expList.innerHTML = `<div class="empty-state">No transactions yet.</div>`; } 
      else {
        expList.innerHTML = store.expenses.map(item => `
          <div class="item-card"><div class="item-info"><span class="item-title">${item.desc}</span><span class="item-subtitle">${item.category} • ${item.date}</span></div>
          <div class="item-meta"><span class="item-amount">-$${Number(item.amount).toFixed(2)}</span><button class="delete-btn" onclick="deleteItem('expenses', '${item.id}')"><span class="material-symbols-rounded" style="font-size:20px;">close</span></button></div></div>
        `).reverse().join('');
      }

      const totalCards = store.cards.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      document.getElementById('totalDueDisplay').textContent = `$${totalCards.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
      const cardList = document.getElementById('cardList');
      if (store.cards.length === 0) { cardList.innerHTML = `<div class="empty-state">All caught up! No dues.</div>`; } 
      else {
        cardList.innerHTML = store.cards.map(item => {
          const days = getDaysDiff(item.dueDate);
          const badge = days < 0 ? `<span class="badge badge-danger">${Math.abs(days)}d Overdue</span>` : (days === 0 ? `<span class="badge badge-danger">Due Today</span>` : `<span class="badge badge-success">Due in ${days}d</span>`);
          return `<div class="item-card"><div class="item-info"><span class="item-title">${item.name}</span><span class="item-subtitle">Due: ${item.dueDate}</span><div>${badge}</div></div>
          <div class="item-meta"><span class="item-amount">$${Number(item.amount).toFixed(2)}</span><button class="delete-btn" onclick="deleteItem('cards', '${item.id}')"><span class="material-symbols-rounded" style="font-size:20px;">close</span></button></div></div>`;
        }).sort((a, b) => getDaysDiff(a.dueDate) - getDaysDiff(b.dueDate)).join('');
      }

      const totalGifts = store.giftcards.reduce((sum, item) => sum + (Number(item.balance) || 0), 0);
      document.getElementById('totalGiftDisplay').textContent = `$${totalGifts.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
      const giftList = document.getElementById('giftList');
      if (store.giftcards.length === 0) { giftList.innerHTML = `<div class="empty-state">No gift cards in vault.</div>`; } 
      else {
        giftList.innerHTML = store.giftcards.map(item => {
          const days = getDaysDiff(item.expiry);
          const badge = days < 0 ? `<span class="badge badge-danger">Expired</span>` : (days === 0 ? `<span class="badge badge-danger">Expires Today</span>` : `<span class="badge badge-success">${days}d left</span>`);
          return `<div class="item-card"><div class="item-info"><span class="item-title">${item.store}</span><span class="item-subtitle">${item.code ? item.code + ' • ' : ''}Exp: ${item.expiry}</span><div>${badge}</div></div>
          <div class="item-meta"><span class="item-amount">$${Number(item.balance).toFixed(2)}</span><button class="delete-btn" onclick="deleteItem('giftcards', '${item.id}')"><span class="material-symbols-rounded" style="font-size:20px;">close</span></button></div></div>`;
        }).sort((a, b) => getDaysDiff(a.expiry) - getDaysDiff(b.expiry)).join('');
      }
    }

    render();
  </script>
</body>
</html>
