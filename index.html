<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vault" />
  <meta name="theme-color" content="#f1f5f9" />
  <title>Vault - Premium Finance</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@28,400,0,0" />

  <style>
    :root {
      --primary: #0f172a;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --danger-bg: #fee2e2;
      --success: #10b981;
      --success-bg: #d1fae5;
      --radius-sm: 12px;
      --radius-md: 20px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      
      /* Exact GitHub Heatmap Colors */
      --heat-0: #ebedf0;
      --heat-1: #9be9a8;
      --heat-2: #40c463;
      --heat-3: #30a14e;
      --heat-4: #216e39;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main);
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }

    header {
      padding: calc(24px + env(safe-area-inset-top)) 24px 16px; background: var(--bg);
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    header h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; }

    main {
      flex: 1; overflow-y: auto; padding: 0 24px 120px; -webkit-overflow-scrolling: touch;
    }

    .view-section { display: none; animation: slideUp 0.4s ease-out forwards; }
    .view-section.active { display: block; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .month-selector {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 16px; margin-bottom: 8px; scrollbar-width: none;
    }
    .month-selector::-webkit-scrollbar { display: none; }
    .month-chip {
      padding: 8px 16px; background: var(--surface); border-radius: 100px; font-size: 13px; font-weight: 600;
      color: var(--text-muted); border: 1px solid #e2e8f0; white-space: nowrap; cursor: pointer; transition: all 0.2s;
    }
    .month-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

    .dashboard-card {
      background: var(--surface); border-radius: var(--radius-md); padding: 24px; color: var(--text-main);
      box-shadow: var(--shadow-sm); margin-bottom: 24px; display: flex; flex-direction: column; gap: 16px; border: 1px solid #e2e8f0;
    }
    .dash-label { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .dash-value { font-size: 36px; font-weight: 800; letter-spacing: -1px; line-height: 1; }

    /* Refined GitHub Heatmap */
    .heatmap-wrapper { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; max-width: 260px; }
    .heatmap-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .heat-box {
      aspect-ratio: 1; border-radius: 3px; display: flex; align-items: center; justify-content: center;
      font-size: 8px; font-weight: 700; color: rgba(255,255,255,0.9);
    }
    .heat-0 { background: var(--heat-0); color: transparent; }
    .heat-1 { background: var(--heat-1); color: #144620; }
    .heat-2 { background: var(--heat-2); }
    .heat-3 { background: var(--heat-3); }
    .heat-4 { background: var(--heat-4); }

    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .card-list { display: flex; flex-direction: column; gap: 12px; }
    .item-card {
      background: var(--surface); border-radius: var(--radius-sm); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm);
    }
    .item-card.used { opacity: 0.5; }
    .item-card.used .item-title { text-decoration: line-through; }
    .item-info { display: flex; flex-direction: column; gap: 4px; }
    .item-title { font-size: 16px; font-weight: 600; }
    .item-subtitle { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .item-meta { display: flex; align-items: center; gap: 12px; }
    .item-amount { font-size: 17px; font-weight: 700; }

    .badge { display: inline-flex; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-top: 4px; }
    .badge-danger { background: var(--danger-bg); color: var(--danger); }
    .badge-success { background: var(--success-bg); color: var(--success); }
    .badge-neutral { background: #f1f5f9; color: var(--text-muted); }

    .icon-btn { 
      background: var(--bg); border: none; color: var(--text-muted); border-radius: 50%; width: 36px; height: 36px; 
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s;
    }
    .icon-btn:active { background: #e2e8f0; }

    /* Repositioned FAB */
    .fab {
      position: fixed; bottom: calc(90px + env(safe-area-inset-bottom)); right: 24px;
      background: #4f46e5; color: white; border: none; border-radius: 50%; width: 56px; height: 56px;
      display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-lg); z-index: 10;
      transition: transform 0.2s; cursor: pointer;
    }
    .fab:active { transform: scale(0.9); }

    nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: calc(72px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      display: flex; justify-content: space-around; align-items: center; z-index: 20; border-top: 1px solid rgba(0,0,0,0.05);
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); width: 33.33%; font-size: 11px; font-weight: 600; background: none; border: none; gap: 4px; cursor: pointer;}
    .nav-item.active { color: #4f46e5; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      display: flex; justify-content: center; align-items: center; z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 24px;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--surface); width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto; border-radius: var(--radius-md); padding: 28px; box-shadow: var(--shadow-lg); }
    .modal-content h2 { font-size: 22px; font-weight: 700; margin-bottom: 24px; }

    .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .field input, .field select { background: var(--bg); border: 1px solid transparent; border-radius: var(--radius-sm); padding: 14px 16px; font-size: 16px; color: var(--text-main); font-family: inherit; font-weight: 500; }
    .field input:focus, .field select:focus { border-color: #4f46e5; outline: none; }
    
    .modal-actions { display: flex; gap: 12px; margin-top: 28px; }
    .btn { flex: 1; padding: 14px; border-radius: var(--radius-sm); font-family: inherit; font-weight: 600; font-size: 15px; cursor: pointer; border: none; }
    .btn-cancel { background: var(--bg); color: var(--text-main); }
    .btn-save { background: #4f46e5; color: white; }
    
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 15px; font-weight: 500; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1 id="appTitle">Overview</h1>
  </header>

  <main>
    <section id="view-expenses" class="view-section active">
      <div class="month-selector" id="monthSelector"></div>
      
      <div class="dashboard-card">
        <div>
          <div class="dash-label">Total Spent</div>
          <div class="dash-value" id="totalExpenseDisplay">₹0.00</div>
        </div>
        <div class="heatmap-wrapper">
          <div class="dash-label" style="font-size: 10px;">Activity Map</div>
          <div class="heatmap-grid" id="expenseHeatmap"></div>
        </div>
      </div>
      
      <div class="section-title">Transactions</div>
      <div class="card-list" id="expenseList"></div>
    </section>

    <section id="view-cards" class="view-section">
      <div class="dashboard-card" style="background: #0f172a; color: white;">
        <div>
          <div class="dash-label" style="color: #cbd5e1;">Pending Dues</div>
          <div class="dash-value" id="totalDueDisplay">₹0.00</div>
        </div>
      </div>
      <div class="section-title">Active Statements</div>
      <div class="card-list" id="cardList"></div>
    </section>

    <section id="view-giftcards" class="view-section">
      <div class="dashboard-card" style="background: #0ea5e9; color: white;">
        <div>
          <div class="dash-label" style="color: #e0f2fe;">Vault Balance</div>
          <div class="dash-value" id="totalGiftDisplay">₹0.00</div>
        </div>
      </div>
      <div class="section-title">Stored Cards</div>
      <div class="card-list" id="giftList"></div>
    </section>
  </main>

  <button class="fab" id="fabAdd">
    <span class="material-symbols-rounded">add</span>
  </button>

  <nav>
    <button class="nav-item active" onclick="switchTab('expenses')">
      <span class="material-symbols-rounded">bar_chart</span>
      <span>Spend</span>
    </button>
    <button class="nav-item" onclick="switchTab('cards')">
      <span class="material-symbols-rounded">credit_card</span>
      <span>Cards</span>
    </button>
    <button class="nav-item" onclick="switchTab('giftcards')">
      <span class="material-symbols-rounded">redeem</span>
      <span>Gifts</span>
    </button>
  </nav>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <h2 id="modalTitle">Add Item</h2>
      <form id="entryForm">
        <div id="dynamicFormFields"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentTab = 'expenses';
    const todayStr = new Date().toISOString().split('T')[0];
    let selectedMonth = todayStr.substring(0, 7); 

    function safeLoad(key) {
      try { return localStorage.getItem(key) ? JSON.parse(localStorage.getItem(key)) : []; } 
      catch (e) { return []; }
    }

    // Bumped to v5 to handle new schema requirements cleanly
    const store = {
      expenses: safeLoad('vault_exp_v5'),
      cards: safeLoad('vault_cards_v5'),
      giftcards: safeLoad('vault_gift_v5')
    };

    function saveStore() {
      localStorage.setItem('vault_exp_v5', JSON.stringify(store.expenses));
      localStorage.setItem('vault_cards_v5', JSON.stringify(store.cards));
      localStorage.setItem('vault_gift_v5', JSON.stringify(store.giftcards));
      render();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      
      const tabIndex = tab === 'expenses' ? 0 : tab === 'cards' ? 1 : 2;
      document.querySelectorAll('.nav-item')[tabIndex].classList.add('active');
      document.getElementById('view-' + tab).classList.add('active');
      
      const titles = { expenses: 'Overview', cards: 'Credit Dues', giftcards: 'Gift Vault' };
      document.getElementById('appTitle').textContent = titles[tab];
    }

    // Dynamic Form UI Logic
    window.toggleCustomCat = function() {
      const select = document.getElementById('expCategory');
      const customDiv = document.getElementById('customCatDiv');
      if(select.value === 'Other') { customDiv.classList.remove('hidden'); document.getElementById('expCustomCat').required = true; } 
      else { customDiv.classList.add('hidden'); document.getElementById('expCustomCat').required = false; }
    };

    window.updatePaymentDropdown = function() {
      const type = document.getElementById('expPaymentType').value;
      const select = document.getElementById('expCardNameSelect');
      const wrapper = document.getElementById('cardSelectionField');
      const customDiv = document.getElementById('customCardDiv');
      
      let options = [];
      if (type === 'Credit Card') {
        options = ["HDFC Diners Club Black", "HDFC Millennia", "HDFC Regalia Gold", "HSBC Live+", "SBI Cashback", "ICICI Amazon Pay", "Axis Magnus", "Other"];
        document.getElementById('cardSelectionLabel').textContent = 'Credit Card Used';
        wrapper.classList.remove('hidden');
      } else if (type === 'Debit Card' || type === 'UPI') {
        options = ["HDFC Bank", "SBI", "ICICI Bank", "Axis Bank", "Kotak Mahindra", "Other"];
        document.getElementById('cardSelectionLabel').textContent = 'Bank Account';
        wrapper.classList.remove('hidden');
      } else { // Cash
        wrapper.classList.add('hidden');
        customDiv.classList.add('hidden');
        return;
      }

      select.innerHTML = options.map(opt => `<option value="${opt}">${opt}</option>`).join('');
      toggleCustomCard();
    };

    window.toggleCustomCard = function() {
      const select = document.getElementById('expCardNameSelect');
      const customDiv = document.getElementById('customCardDiv');
      if(select && select.value === 'Other') { customDiv.classList.remove('hidden'); document.getElementById('expCustomCard').required = true; } 
      else { customDiv.classList.add('hidden'); document.getElementById('expCustomCard').required = false; }
    };

    const fabBtn = document.getElementById('fabAdd');
    const modal = document.getElementById('modalOverlay');
    const formFields = document.getElementById('dynamicFormFields');
    const entryForm = document.getElementById('entryForm');

    fabBtn.addEventListener('click', () => {
      if (currentTab === 'expenses') {
        document.getElementById('modalTitle').textContent = 'New Expense';
        formFields.innerHTML = `
          <div class="field"><label>Amount (₹)</label><input type="number" step="0.01" id="expAmount" required /></div>
          <div class="field"><label>Description</label><input type="text" id="expDesc" placeholder="e.g. Swiggy, Uber" required /></div>
          <div class="field"><label>Category</label>
            <select id="expCategory" onchange="toggleCustomCat()">
              <option>Food & Dining</option><option>Groceries</option><option>Transport</option>
              <option>Shopping</option><option>Bills & Utilities</option><option>Entertainment</option>
              <option value="Other">Other (Specify)</option>
            </select>
          </div>
          <div class="field hidden" id="customCatDiv"><label>Custom Category</label><input type="text" id="expCustomCat" /></div>
          
          <div class="field"><label>Payment Type</label>
            <select id="expPaymentType" onchange="updatePaymentDropdown()">
              <option value="Credit Card">Credit Card</option>
              <option value="Debit Card">Debit Card</option>
              <option value="UPI">UPI</option>
              <option value="Cash">Cash</option>
            </select>
          </div>
          <div class="field" id="cardSelectionField"><label id="cardSelectionLabel">Credit Card Used</label>
            <select id="expCardNameSelect" onchange="toggleCustomCard()"></select>
          </div>
          <div class="field hidden" id="customCardDiv"><label>Specify Details</label><input type="text" id="expCustomCard" /></div>
          
          <div class="field"><label>Date</label><input type="date" id="expDate" value="${todayStr}" required /></div>
        `;
        // Trigger population
        updatePaymentDropdown();
      } else if (currentTab === 'cards') {
        document.getElementById('modalTitle').textContent = 'Log Statement';
        formFields.innerHTML = `
          <div class="field"><label>Outstanding Balance (₹)</label><input type="number" step="0.01" id="cardAmount" required /></div>
          <div class="field"><label>Card Name</label><input type="text" id="cardName" required /></div>
          <div class="field"><label>Due Date</label><input type="date" id="cardDueDate" required /></div>
        `;
      } else {
        document.getElementById('modalTitle').textContent = 'Store Gift Card';
        formFields.innerHTML = `
          <div class="field"><label>Gift Card Name</label><input type="text" id="giftName" required /></div>
          <div class="field"><label>Balance (₹)</label><input type="number" step="0.01" id="giftBalance" required /></div>
          <div class="field"><label>Source</label><input type="text" id="giftSource" required /></div>
          <div class="field"><label>Validity</label>
            <select id="giftExpirySelect"><option value="3">3 Months</option><option value="6">6 Months</option><option value="12">12 Months</option></select>
          </div>
          <div class="field"><label>PIN / Notes</label><input type="text" id="giftCode" /></div>
        `;
      }
      modal.classList.add('active');
    });

    function closeModal() { modal.classList.remove('active'); setTimeout(() => entryForm.reset(), 300); }

    entryForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = Date.now().toString();

      if (currentTab === 'expenses') {
        const catVal = document.getElementById('expCategory').value;
        const finalCat = catVal === 'Other' ? document.getElementById('expCustomCat').value : catVal;
        
        const typeVal = document.getElementById('expPaymentType').value;
        let finalCard = 'Cash';
        if (typeVal !== 'Cash') {
          const cardVal = document.getElementById('expCardNameSelect').value;
          finalCard = cardVal === 'Other' ? document.getElementById('expCustomCard').value : cardVal;
        }
        
        store.expenses.push({ id, desc: document.getElementById('expDesc').value, amount: Number(document.getElementById('expAmount').value), category: finalCat, cardUsed: finalCard, cardType: typeVal, date: document.getElementById('expDate').value });
        selectedMonth = document.getElementById('expDate').value.substring(0, 7);
      } else if (currentTab === 'cards') {
        store.cards.push({ id, name: document.getElementById('cardName').value, amount: Number(document.getElementById('cardAmount').value), dueDate: document.getElementById('cardDueDate').value });
      } else {
        const months = parseInt(document.getElementById('giftExpirySelect').value);
        const expDate = new Date(); expDate.setMonth(expDate.getMonth() + months);
        store.giftcards.push({ id, name: document.getElementById('giftName').value, balance: Number(document.getElementById('giftBalance').value), source: document.getElementById('giftSource').value, expiry: expDate.toISOString().split('T')[0], code: document.getElementById('giftCode').value || '', isUsed: false });
      }
      saveStore(); closeModal();
    });

    window.deleteItem = function(type, id) { store[type] = store[type].filter(i => i.id !== id); saveStore(); };
    window.toggleGiftUsed = function(id) { const idx = store.giftcards.findIndex(i => i.id === id); if(idx !== -1) { store.giftcards[idx].isUsed = !store.giftcards[idx].isUsed; saveStore(); } };
    window.setMonth = function(m) { selectedMonth = m; render(); };

    function getDaysDiff(dStr) { const t = new Date(); t.setHours(0,0,0,0); return Math.ceil((new Date(dStr) - t) / 86400000); }

    function renderHeatmap(expenses) {
      const grid = document.getElementById('expenseHeatmap');
      if(!selectedMonth) return;
      
      const [yr, mo] = selectedMonth.split('-');
      const days = new Date(yr, mo, 0).getDate();
      const daily = Array(days + 1).fill(0);
      expenses.forEach(e => { daily[parseInt(e.date.split('-')[2])] += Number(e.amount); });

      const nonZero = daily.filter(v => v > 0);
      const minVal = nonZero.length > 0 ? Math.min(...nonZero) : 0;
      const maxVal = nonZero.length > 0 ? Math.max(...nonZero) : 0;
      const range = (maxVal - minVal) || 1; 

      let html = '';
      for(let i = 1; i <= days; i++) {
        const val = daily[i];
        let heat = 'heat-0';
        if (val > 0) {
          const pct = (val - minVal) / range;
          if (pct > 0.75) heat = 'heat-4';
          else if (pct > 0.40) heat = 'heat-3';
          else if (pct > 0.10) heat = 'heat-2';
          else heat = 'heat-1';
        }
        html += `<div class="heat-box ${heat}">${i}</div>`;
      }
      grid.innerHTML = html;
    }

    function render() {
      // Expenses
      const allMonths = [...new Set([...store.expenses.map(e => e.date.substring(0, 7)), todayStr.substring(0,7)])].sort().reverse();
      document.getElementById('monthSelector').innerHTML = allMonths.map(m => `<button class="month-chip ${m === selectedMonth ? 'active' : ''}" onclick="setMonth('${m}')">${new Date(m + '-01').toLocaleDateString('en-US', {month:'short', year:'numeric'})}</button>`).join('');
      
      const mExp = store.expenses.filter(e => e.date.substring(0,7) === selectedMonth);
      document.getElementById('totalExpenseDisplay').textContent = `₹${mExp.reduce((s, i) => s + Number(i.amount), 0).toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
      renderHeatmap(mExp);

      const expList = document.getElementById('expenseList');
      if (mExp.length === 0) { expList.innerHTML = `<div class="empty-state">No transactions in this month.</div>`; } 
      else {
        expList.innerHTML = mExp.map(item => `
          <div class="item-card"><div class="item-info"><span class="item-title">${item.desc}</span><span class="item-subtitle">${item.category} • ${item.date}</span><span class="item-subtitle" style="font-size: 11px; margin-top: 2px;">💳 ${item.cardType !== 'Cash' ? item.cardUsed + ' (' + item.cardType + ')' : 'Cash'}</span></div>
          <div class="item-meta"><span class="item-amount text-danger">-₹${Number(item.amount).toLocaleString('en-IN', {minimumFractionDigits:2})}</span><button class="icon-btn" onclick="deleteItem('expenses', '${item.id}')"><span class="material-symbols-rounded" style="font-size:20px;">delete</span></button></div></div>
        `).reverse().join('');
      }

      // Cards
      document.getElementById('totalDueDisplay').textContent = `₹${store.cards.reduce((s, i) => s + Number(i.amount), 0).toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
      const cardList = document.getElementById('cardList');
      if (store.cards.length === 0) { cardList.innerHTML = `<div class="empty-state">All caught up! No dues.</div>`; } 
      else {
        cardList.innerHTML = store.cards.map(item => {
          const days = getDaysDiff(item.dueDate);
          const badge = days < 0 ? `<span class="badge badge-danger">${Math.abs(days)}d Overdue</span>` : (days === 0 ? `<span class="badge badge-danger">Due Today</span>` : `<span class="badge badge-success">Due in ${days}d</span>`);
          return `<div class="item-card"><div class="item-info"><span class="item-title">${item.name}</span><span class="item-subtitle">Due: ${item.dueDate}</span><div>${badge}</div></div>
          <div class="item-meta"><span class="item-amount">₹${Number(item.amount).toLocaleString('en-IN', {minimumFractionDigits:2})}</span><button class="icon-btn" onclick="deleteItem('cards', '${item.id}')"><span class="material-symbols-rounded" style="font-size:20px;">delete</span></button></div></div>`;
        }).sort((a, b) => getDaysDiff(a.dueDate) - getDaysDiff(b.dueDate)).join('');
      }

      // Gifts
      document.getElementById('totalGiftDisplay').textContent = `₹${store.giftcards.filter(g => !g.isUsed).reduce((s, i) => s + Number(i.balance), 0).toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
      const giftList = document.getElementById('giftList');
      if (store.giftcards.length === 0) { giftList.innerHTML = `<div class="empty-state">No gift cards in vault.</div>`; } 
      else {
        giftList.innerHTML = [...store.giftcards].sort((a, b) => a.isUsed === b.isUsed ? getDaysDiff(a.expiry) - getDaysDiff(b.expiry) : (a.isUsed ? 1 : -1)).map(item => {
          const days = getDaysDiff(item.expiry);
          const badge = item.isUsed ? `<span class="badge badge-neutral">Used</span>` : (days < 0 ? `<span class="badge badge-danger">Expired</span>` : (days === 0 ? `<span class="badge badge-danger">Expires Today</span>` : `<span class="badge badge-success">${days}d left</span>`));
          return `<div class="item-card ${item.isUsed ? 'used' : ''}"><div class="item-info"><span class="item-title">${item.name}</span><span class="item-subtitle">Source: ${item.source}</span><span class="item-subtitle">${item.code ? 'Code: ' + item.code + ' • ' : ''}Exp: ${item.expiry}</span><div>${badge}</div></div>
          <div class="item-meta"><span class="item-amount">₹${Number(item.balance).toLocaleString('en-IN', {minimumFractionDigits:2})}</span>
          <div style="display:flex; flex-direction:column; gap:4px;"><button class="icon-btn" onclick="toggleGiftUsed('${item.id}')"><span class="material-symbols-rounded" style="font-size:20px; color:${item.isUsed ? '#10b981' : 'var(--text-muted)'}">${item.isUsed ? 'check_circle' : 'check'}</span></button>
          <button class="icon-btn" onclick="deleteItem('giftcards', '${item.id}')"><span class="material-symbols-rounded" style="font-size:20px;">delete</span></button></div></div></div>`;
        }).join('');
      }
    }
    render();
  </script>
</body>
</html>
