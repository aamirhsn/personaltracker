<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vault" />
  <meta name="theme-color" content="#f1f5f9" />
  <title>Vault - Premium Finance</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@28,400,0,0" />

  <style>
    :root {
      --primary: #0f172a; --bg: #f1f5f9; --surface: #ffffff;
      --text-main: #0f172a; --text-muted: #64748b;
      --danger: #ef4444; --danger-bg: #fee2e2;
      --success: #10b981; --success-bg: #d1fae5;
      --radius-sm: 12px; --radius-md: 20px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      --heat-0: #ebedf0; --heat-1: #9be9a8; --heat-2: #40c463; --heat-3: #30a14e; --heat-4: #216e39;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header { padding: calc(24px + env(safe-area-inset-top)) 24px 16px; background: var(--bg); display: flex; justify-content: space-between; align-items: flex-end; }
    header h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; }

    main { flex: 1; overflow-y: auto; padding: 0 24px 120px; -webkit-overflow-scrolling: touch; }
    .view-section { display: none; animation: slideUp 0.4s ease-out forwards; }
    .view-section.active { display: block; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .month-selector { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 16px; margin-bottom: 8px; scrollbar-width: none; }
    .month-selector::-webkit-scrollbar { display: none; }
    .month-chip { padding: 8px 16px; background: var(--surface); border-radius: 100px; font-size: 13px; font-weight: 600; color: var(--text-muted); border: 1px solid #e2e8f0; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
    .month-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

    .dashboard-card { background: var(--surface); border-radius: var(--radius-md); padding: 24px; color: var(--text-main); box-shadow: var(--shadow-sm); margin-bottom: 24px; display: flex; flex-direction: column; gap: 16px; border: 1px solid #e2e8f0; }
    .dash-label { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .dash-value { font-size: 36px; font-weight: 800; letter-spacing: -1px; line-height: 1; }

    .heatmap-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 8px; width: 100%; }
    .heatmap-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; width: 100%; max-width: 280px; }
    .heat-box { aspect-ratio: 1; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.9); }
    .heat-0 { background: var(--heat-0); color: transparent; }
    .heat-1 { background: var(--heat-1); color: #144620; }
    .heat-2 { background: var(--heat-2); }
    .heat-3 { background: var(--heat-3); }
    .heat-4 { background: var(--heat-4); }
    .heat-hidden { visibility: hidden; } 

    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .card-list { display: flex; flex-direction: column; gap: 16px; }
    
    .item-card { background: var(--surface); border-radius: var(--radius-sm); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm); }
    .item-info { display: flex; flex-direction: column; gap: 4px; }
    .item-title { font-size: 16px; font-weight: 600; }
    .item-subtitle { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .item-amount { font-size: 17px; font-weight: 700; }

    .cc-card { background: linear-gradient(135deg, #1e293b, #0f172a); border-radius: 16px; padding: 24px; color: white; position: relative; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.3); display: flex; flex-direction: column; gap: 20px; }
    .cc-card::after { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%); pointer-events: none; }
    .cc-top { display: flex; justify-content: space-between; align-items: center; }
    .cc-chip { background: #fbbf24; width: 36px; height: 26px; border-radius: 4px; opacity: 0.9; border: 1px solid rgba(0,0,0,0.1); }
    .cc-num { font-family: 'Space Mono', monospace; font-size: 18px; letter-spacing: 2px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); margin-top: 8px;}
    .cc-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
    .cc-label { font-size: 10px; text-transform: uppercase; opacity: 0.7; letter-spacing: 1px; margin-bottom: 4px; }
    .cc-val { font-size: 14px; font-weight: 600; }
    .cc-amount { font-size: 24px; font-weight: 800; color: #f87171; }
    
    .gift-card { background: linear-gradient(135deg, #0ea5e9, #3b82f6); border-radius: 12px; padding: 20px; color: white; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.3); position: relative; border-left: 6px dashed rgba(255,255,255,0.3); }
    .gift-card.used { filter: grayscale(1); opacity: 0.6; }
    .gift-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .gift-val { font-size: 28px; font-weight: 800; }
    .gift-title { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }

    .badge { display: inline-flex; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-top: 4px; }
    .badge-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .badge-success { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    
    .icon-btn { background: rgba(255,255,255,0.1); border: none; color: white; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(4px); z-index: 2;}
    .item-card .icon-btn { background: var(--bg); color: var(--text-muted); }

    .fab { position: fixed; bottom: calc(90px + env(safe-area-inset-bottom)); right: 24px; background: #4f46e5; color: white; border: none; border-radius: 50%; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-lg); z-index: 10; transition: transform 0.2s; cursor: pointer; }
    .fab:active { transform: scale(0.9); }

    nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(72px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; z-index: 20; border-top: 1px solid rgba(0,0,0,0.05); }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); width: 33.33%; font-size: 11px; font-weight: 600; background: none; border: none; gap: 4px; cursor: pointer;}
    .nav-item.active { color: #4f46e5; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 24px; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--surface); width: 100%; max-width: 400px; max-height: 85vh; overflow-y: auto; border-radius: var(--radius-md); padding: 28px; box-shadow: var(--shadow-lg); }
    .modal-content h2 { font-size: 22px; font-weight: 700; margin-bottom: 24px; }

    .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .field input, .field select { background: var(--bg); border: 1px solid transparent; border-radius: var(--radius-sm); padding: 14px 16px; font-size: 16px; color: var(--text-main); font-family: inherit; font-weight: 500; }
    .field input:focus, .field select:focus { border-color: #4f46e5; outline: none; }
    
    .modal-actions { display: flex; gap: 12px; margin-top: 12px; }
    .btn { flex: 1; padding: 14px; border-radius: var(--radius-sm); font-family: inherit; font-weight: 600; font-size: 15px; cursor: pointer; border: none; }
    .btn-cancel { background: var(--bg); color: var(--text-main); }
    .btn-save { background: #4f46e5; color: white; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 15px; font-weight: 500; }
    .hidden { display: none !important; }
  </style>

  <script>
    // Critical Failsafe Error Catcher
    window.onerror = function(msg, url, line) {
      document.body.innerHTML = `<div style="padding:40px; color:#ef4444; padding-top:80px; font-family:sans-serif;"><b>Vault Crashed</b><br><br>Error: ${msg}<br>Line: ${line}<br><br>Please tap Restore Data in settings if you have a backup.</div>`;
    };
  </script>
</head>
<body>

  <header>
    <h1 id="appTitle">Overview</h1>
    <button class="icon-btn" onclick="document.getElementById('settingsModal').classList.add('active')" style="color:var(--text-main); background:transparent;"><span class="material-symbols-rounded">settings</span></button>
  </header>

  <main>
    <section id="view-expenses" class="view-section active">
      <div class="month-selector" id="monthSelector"></div>
      <div class="dashboard-card">
        <div><div class="dash-label">Total Spent</div><div class="dash-value" id="totalExpenseDisplay">₹0.00</div></div>
        <div class="heatmap-wrapper">
          <div class="dash-label" style="font-size: 10px; margin-bottom: 4px;">Activity Map</div>
          <div class="heatmap-grid" id="expenseHeatmap"></div>
        </div>
      </div>
      <div class="section-title">Transactions</div>
      <div class="card-list" id="expenseList"></div>
    </section>

    <section id="view-cards" class="view-section">
      <div class="dashboard-card" style="background: #0f172a; color: white;">
        <div><div class="dash-label" style="color: #cbd5e1;">Pending Dues</div><div class="dash-value" id="totalDueDisplay">₹0.00</div></div>
      </div>
      <div class="section-title">Active Statements</div>
      <div class="card-list" id="cardList"></div>
    </section>

    <section id="view-giftcards" class="view-section">
      <div class="dashboard-card" style="background: #0ea5e9; color: white;">
        <div><div class="dash-label" style="color: #e0f2fe;">Vault Balance</div><div class="dash-value" id="totalGiftDisplay">₹0.00</div></div>
      </div>
      <div class="section-title">Stored Cards</div>
      <div class="card-list" id="giftList"></div>
    </section>
  </main>

  <button class="fab" id="fabAdd"><span class="material-symbols-rounded">add</span></button>

  <nav>
    <button class="nav-item active" onclick="switchTab('expenses')"><span class="material-symbols-rounded">bar_chart</span><span>Spend</span></button>
    <button class="nav-item" onclick="switchTab('cards')"><span class="material-symbols-rounded">credit_card</span><span>Cards</span></button>
    <button class="nav-item" onclick="switchTab('giftcards')"><span class="material-symbols-rounded">redeem</span><span>Gifts</span></button>
  </nav>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <h2 id="modalTitle">Add Item</h2>
      <form id="entryForm">
        <div id="dynamicFormFields"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <h2>Settings & Data</h2>
      
      <div class="field">
        <label>Daily Auto-Backup Time</label>
        <input type="time" id="backupTimeInput" onchange="saveConfig()" />
        <p style="font-size:11px; color:var(--text-muted); margin-top:4px; line-height:1.4;">*Because this is a private app without servers, the app must be opened after this time to trigger the daily download prompt.</p>
      </div>
      
      <div style="border-top: 1px solid #e2e8f0; margin: 20px 0;"></div>
      
      <div class="field">
        <label>Manual Controls</label>
        <button type="button" class="btn btn-save" onclick="downloadBackup()" style="margin-bottom: 8px;">Export Backup File</button>
        <label class="btn btn-cancel" style="text-align:center; display:block; cursor:pointer;">
          Restore Data from File
          <input type="file" accept=".json" style="display:none;" onchange="restoreBackup(event)" />
        </label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-cancel" onclick="document.getElementById('settingsModal').classList.remove('active')" style="width:100%;">Close Settings</button>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'expenses';
    const todayStr = new Date().toISOString().split('T')[0];
    let selectedMonth = todayStr.substring(0, 7); 

    function safeLoad(key) {
      try { return localStorage.getItem(key) ? JSON.parse(localStorage.getItem(key)) : []; } 
      catch (e) { return []; }
    }

    // Bumped to v7 for safety + Config Store
    const store = {
      expenses: safeLoad('vault_exp_v7'),
      cards: safeLoad('vault_cards_v7'),
      giftcards: safeLoad('vault_gift_v7')
    };

    let config = { backupTime: '18:00', lastBackup: '' };
    try { 
      const conf = localStorage.getItem('vault_config_v7');
      if (conf) config = JSON.parse(conf); 
    } catch(e) {}

    document.getElementById('backupTimeInput').value = config.backupTime;

    function saveStore() {
      localStorage.setItem('vault_exp_v7', JSON.stringify(store.expenses));
      localStorage.setItem('vault_cards_v7', JSON.stringify(store.cards));
      localStorage.setItem('vault_gift_v7', JSON.stringify(store.giftcards));
      render();
    }

    function saveConfig() {
      config.backupTime = document.getElementById('backupTimeInput').value;
      localStorage.setItem('vault_config_v7', JSON.stringify(config));
    }

    // Backup Engine
    function triggerAutoBackupCheck() {
      if (!config.backupTime) return;
      const now = new Date();
      const currentStr = now.toTimeString().substring(0, 5);
      
      if (currentStr >= config.backupTime && config.lastBackup !== todayStr) {
        downloadBackup();
        config.lastBackup = todayStr;
        localStorage.setItem('vault_config_v7', JSON.stringify(config));
      }
    }

    function downloadBackup() {
      const dataStr = JSON.stringify(store, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Vault_Backup_${todayStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function restoreBackup(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.expenses && imported.cards && imported.giftcards) {
             store.expenses = imported.expenses;
             store.cards = imported.cards;
             store.giftcards = imported.giftcards;
             saveStore();
             alert("Data restored successfully!");
             document.getElementById('settingsModal').classList.remove('active');
          } else { alert("Invalid backup file structure."); }
        } catch(err) { alert("Error reading backup file."); }
      };
      reader.readAsText(file);
    }

    // Run backup check on load and every 60 seconds
    triggerAutoBackupCheck();
    setInterval(triggerAutoBackupCheck, 60000);

    function
